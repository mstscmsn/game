name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "逆圣：黑日遗嘱 ${{ github.event.inputs.tag_name || github.ref_name }}"
          body: |
            **ANATHEMA — TESTAMENT OF THE BLACK SUN**

            > 死亡不是结算界面。死亡是通往下一层世界的门。

            暗黑哥特 Roguelite 割草游戏，Web 与安卓双端。

            ## 下载
            | 文件 | 说明 |
            |---|---|
            | `anathema-v1.5-release.apk` | 安卓正式版（已签名，直接安装；Android 7.0+） |
            | `anathema-v1.5-debug.apk` | 安卓调试版（便于侧载测试） |
            | `anathema-standalone.html` | 单文件 Web 版——下载后用浏览器打开即玩，无需服务器 |

            ## v1.5 更新（人性化 × 成长优化 · 10人评审）
            **人性化（5位UX评审官）**
            - 缝尸台：**双击角色直接开局**；已解锁角色置顶+新肖像卡（主题色辉光+金框）；出发按钮显示实际配置（难度+罪印）并记住上次选择；锁定角色折叠到下方
            - 主菜单「快速出发」一键入局（显示角色+难度）；结算页「立即再战」一键重开同配置同模式 + 「拜访灰烬公证人 · N项可购」直达消费；难度页默认高亮上次难度；暂停「放弃本局」两段确认防误触
            - 升级卡弹出350ms输入保护（防战斗中误触跳过）；首局术语图例（催化物/融合）；罪技充能来源提示；死神收割长按加速（首死保留完整仪式）
            - 图鉴：详情吸顶+分区导航+顶部返回；成长树：买不起抖动提示「还差N灰」+两段确认；HUD字号全面提升；罪技/闪避按钮拉开防误触；全部<11px文字清理
            - 反馈补全：满血拾取显示「生命已满」（不再假+14）、护盾格挡「叮」+高亮、跳过升级满血转盾播报、精英警告改在玩家身边、Boss登场前10秒预警
            **成长机制（5位成长评审官全局优化）**
            - 升级卡平滑：未匹配催化物大幅降权、武器升级保底（最多2轮不见）、缺融合催化物时提权+3轮硬保底、「距神器一步」金框冲刺卡、保底卡位置洗牌、增殖圣痕稀有化+Lv12软保底、后期新武器带等级进场、满配后超载卡/晋升卡（圣化之刃/铁壁/血肉修补）
            - 宝箱保底修复（不再被吞）：槽满弹催化物替换三选、已持催化物则武器+2级；兜底定向化——每局最迟第二章末摸到神器；首只精英必掉宝箱
            - 正反馈：选卡即时生效（武器立刻开火+金色爆花+累计值浮字）、连诛系统（20/40/80连杀奖励+音调阶梯）、Boss阶段击破喷洒宝石+软狂暴增伤播报、每级+2生命/+1%伤害+升级回血10%、卡面显示本级具体收益与阈值金字
            - 数值曲线：敌人强度改「区域锚定时钟」（杜绝落后死亡螺旋与后期一碰死）、安洛/米弥血量回落到40-70秒击杀带、xpNeed曲线修正、精英经验随等级缩放
            - 局外经济：击杀灰烬翻倍+等级结算奖励+前3局150保底（实测137灰/分钟）、堕翼树骨片死锁解除（审判失败+2骨）、QoL节点降价、移速/闪避节点增效
            - 图标二轮精修：46个属性/遗物图标双色调重绘

            ## v1.4 更新（美术深度重做）
            **精灵全面重绘（像素密度×4）**
            - 10 位角色、24 种敌人、8 个 Boss 全部以双倍网格重绘：更细的服饰/材质/身份细节（阿德里克棺盾红心灯、薇尔娜悬浮空冠鸦羽裙、吞钟鲸肋腔七钟、圣母肋骨窗黑日……），屏幕占比不变、细节翻四倍
            - 每个精灵新增手绘第二姿态帧，构成 4 相步态循环（接触-碎步-迈步-碎步）
            **动画系统扩展**
            - 怪物：出生破土（升起+扬尘）、冲刺怪红光前摇+冲刺拉伸、射手开火预闪、矮圆体压扁爬行、死亡压扁淡出、精英金环脉动
            - 角色：闪避残影拖尾、待机呼吸、4 相走路
            - Boss：入场膨胀登场、攻击前自动切换「威胁帧」（张口/抬臂/发光）、呼吸起伏
            **图标精修**
            - 16 个武器图标全部重绘：双色调笔画+材质暗示+装饰刻线（木纹枪托、青铜钟、宝石匕首……）；统一暗描边+高光收尾管线
            - 神器图标升级为碎裂红环+外放射；禁器图标升级为黑日轮盘+日冕尖刺
            **UI 特效与动画**
            - 局外屏落灰粒子层、黑日徽记辉光脉动、标题字距入场
            - 主按钮金色扫光、按压反馈；升级卡按品质呼吸发光、选中闪白
            - 屏幕切换淡出淡入、结算数字滚动、收益条目交错入场、横幅滑入滑出、NPC 卡抬升、死亡屏红晕脉动
            - HUD：玩家/Boss 血条受击白色滞后段、经验获取脉冲；弹道拖尾与辉光升级

            ## v1.3 更新（9人评审 · 三域优化）
            **剧情**
            - 新增 2 个完整结局：「无声的和平」（净化圣母）与「无星之夜」（告解未齐时摧毁输送器），结局图鉴增至 7 条
            - **告解匣**：铁钉神父处新增告解收藏馆——拾得的 70 份告解可随时重读，未拾得的显示 ？？？ 收集诱饵；圣徒告解七印一目了然
            - 圣徒告解（真结局钥匙）改为仪式化拾取：全屏卡片 + 进度「圣徒告解 X/7」，不再一闪而过
            - 堕翼审判改为正式开场：拉赫希尔的宣言逐行呈现，读完才开战计时；胜败台词全屏演出，二次相遇有全新台词
            - 假天堂礼物改为主动抉择（接过 / 打翻），住民低语每隔数秒浮现；死神登场台词随死亡次数轮换，白廊获得完整入场诗
            - 剧情卷轴改为点击逐行推进、长按跳过；Boss 出场/遗言逐句演出；六位 NPC 语域重写 + 通关后新增台词 + 死因针对性吐槽
            - 死亡结算显示「殁于何地 · 死因」；区域诗随重访轮换
            **玩法**
            - 催化物共鸣：每件催化物为对应武器提供专属加成（射程/轨道/穿透等）并显示于卡面
            - 遗物宝箱改为三选一（含被诅咒选项）；新增稀有「份量」强化卡；宝箱保底（第3箱必出所需催化物）
            - 章节波形：55s/100s 两波「尸潮涌动」+ Boss 战后 6 秒余烬谷释放压力节奏；Boss 战小怪限流保持可读性
            - 每武器专属开火音色；击杀连锁音高下沉；暴击顿帧+震屏微反馈
            **画面**
            - 心灯照明（骨白径向光）、角色白描边、Boss 加大 1.55 倍 + 阴影池 + 血条加粗、伤害数字弹跳、低血红边脉冲
            - 大型剪影景物（枯树/钟楼/铁花/白礼拜堂等）铺满各区域；升级卡片交错入场动画；主菜单黑日徽记

            ## v1.2 更新
            - **移动端操控优化**：左半屏任意位置拖动召出摇杆（带引导提示）；闪避与罪技按钮上调至拇指弧区并加大（罪技显示充能读数、按下有反馈）；剧情弹窗移出拇指区不再挡摇杆
            - 刘海屏/手势条安全区适配（HUD 自动避让）；切到后台自动暂停
            - 摇杆行程加大更细腻；暂停按钮加大

            ## v1.1 更新
            - 章节推进改为 **Boss 门控**：进区约130秒后区域Boss降临，必须击败才进入下一章；每章约3分钟，整局约20分钟
            - 美术精细化：精灵光照精修、双帧走路动画、受击白闪、尸体溶解、实体投影、环境飘尘、水面波光
            - 修复：局外成长树无法购买且显示 undefined、经验球吸附抖动、罪技无充能反馈（充能速度翻倍）
            - 重平衡：升级更快、Boss 血量与敌人成长按新节奏全面重调

            ## 内容
            - 完整朝圣世界线：死神处决 → 堕翼审判 → 地狱 → 假天堂（顺从值）→ 真天堂 → 5 结局
            - 10 角色 · 16 武器 · 16 神器 · 6 创世禁器 · 24 遗物 · 8 区域 Boss · 70 份告解
            - 四条局外成长树 · 4 难度 + 罪印 · 章节狩猎 / 每日罪印 / 黑日无尽
            - 全部美术、音乐、剧情为程序化原创生成

            操作：左摇杆移动，右侧闪避与罪技；桌面 WASD + 空格 + Q。
          files: |
            release/anathema-v1.5-release.apk
            release/anathema-v1.5-debug.apk
            release/anathema-standalone.html
