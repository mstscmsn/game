name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "逆圣：黑日遗嘱 ${{ github.event.inputs.tag_name || github.ref_name }}"
          body: |
            **ANATHEMA — TESTAMENT OF THE BLACK SUN**

            > 死亡不是结算界面。死亡是通往下一层世界的门。

            暗黑哥特 Roguelite 割草游戏，Web 与安卓双端。

            ## 下载
            | 文件 | 说明 |
            |---|---|
            | `anathema-v1.2-release.apk` | 安卓正式版（已签名，直接安装；Android 7.0+） |
            | `anathema-v1.2-debug.apk` | 安卓调试版（便于侧载测试） |
            | `anathema-standalone.html` | 单文件 Web 版——下载后用浏览器打开即玩，无需服务器 |

            ## v1.2 更新
            - **移动端操控优化**：左半屏任意位置拖动召出摇杆（带引导提示）；闪避与罪技按钮上调至拇指弧区并加大（罪技显示充能读数、按下有反馈）；剧情弹窗移出拇指区不再挡摇杆
            - 刘海屏/手势条安全区适配（HUD 自动避让）；切到后台自动暂停
            - 摇杆行程加大更细腻；暂停按钮加大

            ## v1.1 更新
            - 章节推进改为 **Boss 门控**：进区约130秒后区域Boss降临，必须击败才进入下一章；每章约3分钟，整局约20分钟
            - 美术精细化：精灵光照精修、双帧走路动画、受击白闪、尸体溶解、实体投影、环境飘尘、水面波光
            - 修复：局外成长树无法购买且显示 undefined、经验球吸附抖动、罪技无充能反馈（充能速度翻倍）
            - 重平衡：升级更快、Boss 血量与敌人成长按新节奏全面重调

            ## 内容
            - 完整朝圣世界线：死神处决 → 堕翼审判 → 地狱 → 假天堂（顺从值）→ 真天堂 → 5 结局
            - 10 角色 · 16 武器 · 16 神器 · 6 创世禁器 · 24 遗物 · 8 区域 Boss · 70 份告解
            - 四条局外成长树 · 4 难度 + 罪印 · 章节狩猎 / 每日罪印 / 黑日无尽
            - 全部美术、音乐、剧情为程序化原创生成

            操作：左摇杆移动，右侧闪避与罪技；桌面 WASD + 空格 + Q。
          files: |
            release/anathema-v1.2-release.apk
            release/anathema-v1.2-debug.apk
            release/anathema-standalone.html
