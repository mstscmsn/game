<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0A0C">
<title>逆圣：黑日遗嘱 — ANATHEMA</title>
<style>
/* ANATHEMA — TESTAMENT OF THE BLACK SUN */
:root {
  --ink: #0B0A0C;
  --deep: #281015;
  --bone: #D8C7A4;
  --blood: #8E1F2F;
  --gold: #B58D3B;
  --corrupt: #49364F;
  --fakewhite: #EEEBDD;
  --trueblue: #11151E;
  --danger: #D4474F;
  --heal: #75876B;
  --bone-dim: #8f8570;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  background: var(--ink);
  overflow: hidden;
  touch-action: none;
  overscroll-behavior: none;
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
  color: var(--bone);
  user-select: none; -webkit-user-select: none;
}
#app { position: fixed; inset: 0; background: var(--ink); }
#game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ui-root { position: absolute; inset: 0; pointer-events: none; }
#ui-root > * { pointer-events: auto; }

/* ---------- generic screen ---------- */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center;
  background: radial-gradient(120% 90% at 50% 0%, #17121a 0%, var(--ink) 55%, #050405 100%);
  overflow-y: auto; overflow-x: hidden;
  touch-action: pan-y;
  padding: calc(24px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
  scrollbar-width: thin; scrollbar-color: var(--corrupt) transparent;
}
.screen.dim { background: rgba(6,5,7,0.88); }
.screen::-webkit-scrollbar { width: 4px; }
.screen::-webkit-scrollbar-thumb { background: var(--corrupt); }

.sc-title {
  font-size: 30px; letter-spacing: 10px; text-indent: 10px; color: var(--bone);
  text-shadow: 0 0 18px rgba(142,31,47,0.55), 0 2px 0 #000;
  margin: 8px 0 2px; text-align: center; font-weight: 700;
}
.sc-sub { font-size: 12px; letter-spacing: 6px; text-indent: 6px; color: var(--gold); opacity: .85; margin-bottom: 14px; text-align:center; }
.sc-note { font-size: 12px; color: var(--bone-dim); text-align: center; line-height: 1.9; }

.divider {
  width: min(78%, 420px); height: 14px; margin: 10px auto; opacity: .8;
  background:
    radial-gradient(circle at 50% 50%, var(--blood) 0 2px, transparent 3px),
    linear-gradient(90deg, transparent 0%, var(--gold) 18%, var(--gold) 82%, transparent 100%) 50% 50% / 100% 1px no-repeat;
}

/* ---------- buttons ---------- */
.btn {
  touch-action: manipulation;
  display: block; width: min(86vw, 360px); margin: 7px auto; padding: 13px 18px;
  background: linear-gradient(180deg, #1a1216 0%, #120c0f 100%);
  border: 1px solid var(--gold); color: var(--bone);
  font-family: inherit; font-size: 17px; letter-spacing: 5px; text-indent:5px; text-align: center;
  cursor: pointer; position: relative;
  clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%);
  transition: background .15s, color .15s;
  min-height: 48px;
}
.btn:active { background: var(--blood); color: #fff; }
.btn.primary { border-color: var(--blood); box-shadow: 0 0 16px rgba(142,31,47,.35) inset; font-size: 19px; }
.btn.small { width: auto; min-width: 120px; padding: 9px 22px; font-size: 14px; margin: 5px; display: inline-block; }
.btn.ghost { opacity: .75; border-color: var(--corrupt); }
.btn:disabled { opacity: .35; pointer-events: none; }
.btn-row { display: flex; flex-wrap: wrap; justify-content: center; width: 100%; }

/* ---------- level up cards ---------- */
.cards-wrap {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(5,4,6,0.82); backdrop-filter: blur(2px);
  padding: calc(12px + var(--safe-top)) 12px calc(12px + var(--safe-bottom));
}
.cards-title { font-size: 17px; letter-spacing: 8px; text-indent:8px; color: var(--gold); margin-bottom: 10px; text-shadow: 0 0 12px rgba(181,141,59,.4); }
.upcard {
  width: min(92vw, 400px); min-height: 108px; margin: 6px 0; padding: 12px 14px;
  display: flex; align-items: center; gap: 14px; cursor: pointer;
  background: linear-gradient(180deg, rgba(30,22,26,.97), rgba(14,10,12,.97));
  border: 1px solid var(--bone-dim); position: relative;
  transition: transform .12s, border-color .12s;
}
.upcard:active { transform: scale(0.97); }
.upcard .ic { width: 60px; height: 60px; flex: 0 0 60px; image-rendering: pixelated; }
.upcard .ic canvas, .upcard .ic img { width: 100%; height: 100%; image-rendering: pixelated; }
.upcard .body { flex: 1; min-width: 0; }
.upcard .nm { font-size: 17px; color: var(--bone); letter-spacing: 2px; margin-bottom: 3px; }
.upcard .lv { font-size: 11px; color: var(--gold); margin-left: 8px; letter-spacing: 1px; }
.upcard .ds { font-size: 12.5px; color: var(--bone-dim); line-height: 1.55; }
.upcard .fuse { font-size: 11px; color: var(--corrupt); margin-top: 4px; letter-spacing: 1px; }
.upcard .fuse.ready { color: var(--gold); text-shadow: 0 0 8px rgba(181,141,59,.6); }
.upcard .tag { position: absolute; top: 6px; right: 8px; font-size: 10px; letter-spacing: 2px; color: var(--bone-dim); }
.upcard.q-common { border-color: #6d6352; }
.upcard.q-rare { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(181,141,59,.35), 0 0 14px rgba(181,141,59,.12); }
.upcard.q-cursed { border-color: var(--corrupt); box-shadow: inset 0 0 18px rgba(73,54,79,.55); }
.upcard.q-cursed .nm { color: #b49ac2; }
.upcard.q-art { border-color: var(--blood); box-shadow: 0 0 0 1px rgba(142,31,47,.5), 0 0 22px rgba(142,31,47,.25); }
.upcard.q-art .nm { color: #e8b0b8; }
.upcard.q-forbidden { border-color: #000; outline: 2px solid var(--blood); box-shadow: 0 0 30px rgba(212,71,79,.4); }
.skipbar { margin-top: 10px; font-size: 13px; color: var(--bone-dim); letter-spacing: 2px; padding: 10px 20px; border: 1px dashed var(--bone-dim); cursor: pointer; min-height:44px; display:flex; align-items:center; }
.skipbar:active { color: var(--bone); }
.reroll-row { display:flex; gap:8px; margin-top:8px; }
.reroll-row .btn.small { margin:0; }

/* ---------- character select ---------- */
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; width: min(94vw, 430px); margin: 8px 0; }
.char-card {
  border: 1px solid var(--bone-dim); background: linear-gradient(180deg,#171114,#0d090b);
  padding: 10px 8px; text-align: center; cursor: pointer; position: relative; min-height: 128px;
}
.char-card.sel { border-color: var(--blood); box-shadow: 0 0 14px rgba(142,31,47,.4); }
.char-card.locked { opacity: .45; filter: grayscale(.8); }
.char-card canvas { width: 72px; height: 72px; image-rendering: pixelated; }
.char-card .cn { font-size: 14px; letter-spacing: 1px; color: var(--bone); }
.char-card .ct { font-size: 10px; color: var(--gold); letter-spacing: 1px; margin-top: 2px; }
.char-card .lk { font-size: 10px; color: var(--bone-dim); margin-top: 4px; line-height:1.5; }
.char-detail { width: min(94vw, 430px); border: 1px solid var(--corrupt); padding: 12px 14px; font-size: 12.5px; line-height: 1.8; color: var(--bone-dim); background: rgba(20,14,18,.6); }
.char-detail b { color: var(--bone); font-weight: normal; }
.char-detail .sin { color: var(--danger); }

/* ---------- hub ---------- */
.hub-npc-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(94vw, 430px); margin: 10px 0; }
.hub-npc {
  border: 1px solid var(--bone-dim); padding: 12px 10px; cursor: pointer; text-align: center;
  background: linear-gradient(180deg,#151013,#0c0a0c); min-height: 78px;
}
.hub-npc:active { border-color: var(--gold); }
.hub-npc .nn { font-size: 15px; letter-spacing: 2px; color: var(--bone); }
.hub-npc .nr { font-size: 10.5px; color: var(--gold); margin-top: 4px; letter-spacing: 1px; }
.hub-npc .nq { font-size: 10px; color: var(--bone-dim); margin-top: 5px; line-height: 1.5; min-height: 28px; }
.res-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 16px; font-size: 12px; color: var(--bone-dim); margin: 8px 0; letter-spacing: 1px; }
.res-bar b { color: var(--bone); font-weight: normal; }

/* ---------- talent tree ---------- */
.tree-tabs { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; justify-content: center; }
.tree-tab { padding: 8px 14px; border: 1px solid var(--bone-dim); font-size: 13px; letter-spacing: 2px; cursor: pointer; color: var(--bone-dim); min-height:40px; }
.tree-tab.on { border-color: var(--gold); color: var(--gold); }
.node-list { width: min(94vw, 430px); }
.node {
  display: flex; align-items: center; gap: 10px; border: 1px solid #3a3230; padding: 10px 12px; margin: 6px 0;
  background: rgba(18,14,16,.7); cursor: pointer;
}
.node .info { flex: 1; }
.node .nn { font-size: 14px; color: var(--bone); letter-spacing: 1px; }
.node .nd { font-size: 11px; color: var(--bone-dim); margin-top: 2px; line-height: 1.5; }
.node .pips { font-size: 12px; color: var(--gold); letter-spacing: 2px; }
.node .cost { font-size: 12px; color: var(--danger); white-space: nowrap; }
.node.maxed { border-color: var(--gold); }
.node.maxed .cost { color: var(--heal); }
.node.cant { opacity: .55; }

/* ---------- dialog / story ---------- */
.story-box {
  position: absolute; left: 50%; bottom: calc(12% + var(--safe-bottom)); transform: translateX(-50%);
  width: min(92vw, 420px); background: rgba(8,6,8,.92); border: 1px solid var(--gold);
  padding: 16px 18px; font-size: 15px; line-height: 2; color: var(--bone); letter-spacing: 1px;
  box-shadow: 0 0 30px rgba(0,0,0,.8);
}
.story-box .who { color: var(--gold); font-size: 12px; letter-spacing: 3px; margin-bottom: 6px; }
.story-box .tap { text-align: right; font-size: 10px; color: var(--bone-dim); margin-top: 8px; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }

.fullstory {
  position: absolute; inset: 0; background: #050405; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 30px; text-align: center;
}
.fullstory .ln { font-size: 16px; line-height: 2.4; letter-spacing: 2px; color: var(--bone); opacity: 0; animation: fadeln 1.4s forwards; }
@keyframes fadeln { to { opacity: 1; } }
.fullstory .endtitle { font-size: 34px; letter-spacing: 14px; text-indent:14px; color: var(--blood); margin: 24px 0; text-shadow: 0 0 24px rgba(142,31,47,.6); opacity:0; animation: fadeln 2s 1s forwards; }

/* ---------- death choice ---------- */
.death-screen {
  position: absolute; inset: 0; background: radial-gradient(80% 60% at 50% 40%, #f2efe6 0%, #d9d4c4 60%, #b9b3a2 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; color: #1a1518;
  animation: whitein 1.8s;
}
@keyframes whitein { from { opacity: 0; } }
.death-line { font-size: 19px; letter-spacing: 4px; color: #14090d; margin: 26px 20px; text-align: center; line-height: 2; }
.death-btn {
  width: min(80vw, 320px); margin: 9px; padding: 15px; font-size: 17px; letter-spacing: 6px; text-indent:6px;
  background: rgba(10,8,10,.92); color: var(--bone); border: 1px solid #35262b; cursor: pointer; font-family: inherit; min-height:52px;
}
.death-btn.wing { border-color: var(--blood); color: #e8c9b0; box-shadow: 0 0 26px rgba(142,31,47,.35); }
.death-btn:active { background: var(--blood); }

/* ---------- results ---------- */
.stat-table { width: min(90vw, 400px); font-size: 13.5px; margin: 10px 0; border-collapse: collapse; }
.stat-table td { padding: 6px 4px; border-bottom: 1px solid rgba(216,199,164,.12); color: var(--bone-dim); }
.stat-table td:last-child { text-align: right; color: var(--bone); }
.gain-list { width: min(90vw, 400px); font-size: 13px; color: var(--gold); line-height: 2; text-align: center; letter-spacing: 1px; }

/* ---------- codex ---------- */
.codex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; width: min(94vw, 430px); margin: 10px 0; }
.codex-item { border: 1px solid #3a3230; padding: 8px 4px; text-align: center; background: rgba(16,12,14,.7); cursor:pointer; }
.codex-item canvas { width: 44px; height: 44px; image-rendering: pixelated; }
.codex-item .cn { font-size: 10.5px; color: var(--bone-dim); margin-top: 3px; line-height: 1.4; }
.codex-item.known .cn { color: var(--bone); }
.codex-item.silhouette canvas { filter: brightness(0) invert(18%) sepia(8%); }
.codex-detail { width: min(94vw, 430px); border:1px solid var(--corrupt); background:rgba(18,13,17,.85); padding:12px 14px; font-size:12.5px; line-height:1.8; color:var(--bone-dim); margin-bottom:10px; }
.codex-detail b { color:var(--gold); font-weight:normal; }

/* ---------- settings ---------- */
.set-row { display: flex; align-items: center; justify-content: space-between; width: min(92vw, 420px); padding: 11px 6px; border-bottom: 1px solid rgba(216,199,164,.1); font-size: 14px; }
.set-row .lab { color: var(--bone-dim); letter-spacing: 1px; }
.toggle { width: 52px; height: 28px; border: 1px solid var(--bone-dim); position: relative; cursor: pointer; background: #14100f; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 4px; width: 20px; height: 20px; background: var(--bone-dim); transition: .15s; }
.toggle.on { border-color: var(--gold); }
.toggle.on::after { left: 26px; background: var(--gold); }
.slider { -webkit-appearance: none; appearance:none; width: 140px; height: 4px; background: #3a3230; outline: none; }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: var(--gold); cursor: pointer; border-radius:0; }

/* ---------- confession pickup toast ---------- */
.confession-toast {
  position: absolute; top: calc(16% + var(--safe-top)); left: 50%; transform: translateX(-50%);
  width: min(88vw, 380px); background: rgba(10,7,9,.94); border: 1px solid var(--gold);
  padding: 14px 16px; z-index: 40; animation: slidedown .4s;
}
@keyframes slidedown { from { transform: translate(-50%,-30px); opacity: 0; } }
.confession-toast .ct { color: var(--gold); font-size: 13px; letter-spacing: 2px; margin-bottom: 6px; }
.confession-toast .cx { color: var(--bone-dim); font-size: 12.5px; line-height: 1.8; }

/* fake heaven UI skin */
body.heaven-skin .screen { background: linear-gradient(180deg,#f4f1e4 0%, #e7e2cf 100%); }
body.heaven-skin .btn, body.heaven-skin .upcard { border-radius: 22px; clip-path: none; }
body.heaven-skin .upcard { background: rgba(255,253,246,.95); border-color: #cfc7ae; }
body.heaven-skin .upcard .nm { color: #4a4438; }
body.heaven-skin .upcard .ds { color: #7a6f5c; }

.hidden { display: none !important; }
.fade-in { animation: fadein .5s; }
@keyframes fadein { from { opacity: 0; } }

.top-note { position:absolute; top: calc(8px + var(--safe-top)); left:50%; transform:translateX(-50%); font-size:12px; letter-spacing:2px; color:var(--bone-dim); background:rgba(8,6,8,.7); padding:6px 14px; border:1px solid #302a28; z-index:30; white-space:nowrap; }

</style>
</head>

<div id="app">
  <canvas id="game-canvas"></canvas>
  <div id="ui-root"></div>
</div>

[[0,"ashfield"],[420,"cathedral"],[840,"bells"],[1260,"corridor"],[1275,"hell"],[1800,"fakeheaven"],[2280,"trueheaven"],[2880,"corpsesea"]],Ti=[{id:"backflow",name:"逆流",desc:"敌方投射物靠近后折返一次"},{id:"moonless",name:"无月",desc:"拾取范围降低，经验宝石价值翻倍"},{id:"fleshbell",name:"肉钟",desc:"每整分钟生成一座持续召怪的肉质钟塔"},{id:"twinsin",name:"双生罪",desc:"精英死亡后生成较弱复制体"},{id:"daysick",name:"白昼病",desc:"停留光照区域累积顺从值"},{id:"blackrain",name:"黑雨",desc:"周期降下伤害敌我的黑色雨滴"},{id:"latedeath",name:"迟来的死亡",desc:"敌人死亡两秒后才爆炸消失"},{id:"hollowsaint",name:"空心圣徒",desc:"Boss生命-20%，攻速+35%"},{id:"noheal",name:"禁止治疗",desc:"治疗转化为临时攻击力"},{id:"hungerart",name:"神器饥饿",desc:"神器触发频率降低，伤害+100%"}]});var E,gn=L(()=>{E={intro:["我在灰烬里醒来，喉咙盛满钟声。","很久以前，天上悬着一枚黑日。","死者归入其腹，如烛归于蜡。","后来，七位圣徒切开了它的影子。","他们把那道伤口，称作白昼。","白昼不是太阳。它是收割的口。","每一句祈祷，都被抽向天空。","而我胸中有一盏灯，还没有熄。"],areaIntro:{ashfield:{title:"灰葬原野",sub:"第一章",lines:["雪不是雪。是未被认领的灰。","碑石朝天张口，替死者继续祈祷。","风把遗骨吹成了路。"]},cathedral:{title:"腐香大教堂",sub:"第二章",lines:["香炉里烧的不是香，是名字。","圣像的眼窝流出蜜色的脓。","唱诗声来自墙的内侧。"]},bells:{title:"七钟沉城",sub:"第三章",lines:["七口钟沉在城的喉咙里。","每一次回响，都有人忘记自己。","水面倒悬着一口未坠的钟。"]},corridor:{title:"终末白廊",sub:"钟声",lines:["白得没有影子的走廊。","钟摆在尽头，数着你的名字。","二十一分。不多，不少。"]},tribunal:{title:"堕翼审判庭",sub:"异议",lines:["一根锁链。一侧断翼。","死亡与地狱之间，有人等你站起。"]},hell:{title:"地狱铁花园",sub:"第四章",lines:["铁在这里开花，花心是真相。","被放逐的记忆在此生根。","狱卒不看守囚徒。看守谎言。"]},fakeheaven:{title:"假天堂",sub:"第五章",lines:["光很温柔。温柔得像蜡封住嘴。","所有人微笑。没有人眨眼。","这里没有夜。也没有出口。"]},trueheaven:{title:"真天堂",sub:"终章",lines:["天堂的肋骨在头顶断裂。","亿万祈祷在管道里发酵成脓。","她在最深处，仍在分娩白昼。"]},corpsesea:{title:"天外尸海",sub:"无尽",lines:["天堂之外，神的尸体漂浮成群岛。","这里没有钟声。只有潮汐。"]}},reaper:{appear:["墨水先于他抵达。","终末书记官合上账簿。","「时限已至。清场开始。」","他没有恨。这更可怕。"],execute:["钟声落下，像一枚图钉。","你被从世界上取了下来。"]},deathChoice:{line:"此死亡不可抵抗，但可以提出异议。",accept:"接受遗忘",challenge:"挑战堕翼者"},rahshiel:{offer:["断翼者垂在锁链之间，抬起头。","「我曾护送亿万灵魂入天堂。」","「直到我看清了天堂的胃。」","「第一次死亡证明你只是凡人。第二次站起来，才证明你是异端。」","「举起武器。向我提出异议。」"],win:["他单膝跪下，断翼扬起灰。","「去吧。地狱只是他们的仓库。」","「从仓库里，把真相偷回去。」"],lose:["「还不够。你的异议太轻了。」","「回到灰里。把恨磨得再亮些。」","「我在原地。我哪儿也去不了。」"]},npcs:{notary:{name:"灰烬公证人",role:"局外成长",lines:["又回来了。签个字，证明你死过。","灰烬不说谎。它只是排队。","你的遗嘱，越写越厚了。","力量要用死亡兑付。我经手。","灵车又向天堂近了一里。","别问终点。我只管沿途的账。"],deathLines:["死于钟声。经典，但不体面。","这种死法，我见过四千次。","伤口很诚实。比你诚实。"]},priest:{name:"铁钉神父",role:"武器与神器",lines:["武器是最后一种诚实的祷词。","我把钉子钉进圣像，也钉进谎言。","催化物喂满了，铁就会开悟。","神器不是赐予的。是逼出来的。","教会烧了我的教堂。我留下了钉。","去吧。替我把白昼钉在地上。"],deathLines:["刃口卷了。你的心也卷了吗。","死一次，钢就多一分记性。","把血擦净。铁不喝凉的血。"]},angel:{name:"失语天使",role:"堕翼与死后",lines:["（她用羽尖在灰上写字。）","「死……不是门。是走廊。」","「我的声音留在天堂了。」","「他们用它唱赞美诗。」","「堕翼者曾抱着我坠落。」","「替我看看，真的星星。」"],deathLines:["（她把一根羽毛按在你的伤上。）","「疼吗。疼是你还没被收走。」","「再去。我为你折一次翼。」"]},mapper:{name:"盲眼制图师",role:"地图与无尽",lines:["我看不见路，所以路骗不了我。","地图，是用走失的人画成的。","天外有海。海里漂着神的尸体。","每张图都有一处，在自己移动。","无尽不是远。是不许你停。","摸着钟声走。钟声从不迷路。"],deathLines:["你死的地方，图上多了个墨点。","死过的路，才算量过。","别怕重走。图就是这样画厚的。"]},mistress:{name:"缝尸女主人",role:"角色与死亡记录",lines:["过来。让我看看针脚还在不在。","每一次死，我都替你收一针。","你的皮囊，是灰烬遗嘱的草稿。","心灯还亮着。别用眼泪去浇。","我缝过圣徒。他们的线是黑的。","死亡记录在此。想听哪一页。"],deathLines:["第几次了。线快要不够了。","这道口子开得漂亮。可惜致命。","躺好。死人不许乱动。"]},waiter:{name:"白衣招待者",role:"假天堂剧情",lines:["欢迎。您的座位一直空着。","这里的烛火，永远不会烧到底。","您累了。这里没有人会催您。","奶与蜜，或是安眠。您选。","外面的战争，与您无关了。","请微笑。这里人人都微笑。"],deathLines:["您受伤了。这里不该有伤。","疼痛是旧世界的行李。放下吧。","下次，别再醒得那么用力。"],twist:["您的顺从值……不，您笑得真好。","名册上有您。一直都有。","我不是招待者。我是关门的人。"]}},fakeHeavenNpc:["你终于不用再战斗了。","留下来吧。这里永远是下午。","我们都很幸福。你也会的。","别提外面。外面已经没有了。","疼痛忘了吗。忘了就好。","钟声很美。别问它在数什么。","你看，光多干净。","睡吧。醒着太辛苦了。","大家都在等你笑一笑。","这里没有死亡。只有安息。"],confessions:[{id:"c01",title:"守墓人手记·一",area:"ashfield",text:"今日葬十七人。新规：尸面朝白昼，口中含蜡。教士说这样灵魂升得快。可我看那不像升，像抽。像井绳把水一桶一桶拎走。"},{id:"c02",title:"无名者的祷文",area:"ashfield",text:"白昼啊，收下我的悔恨，收下我的恐惧，收下我全部的疼。……可为何每次祷告之后，我更空了。像被舀过一勺又一勺的汤。"},{id:"c03",title:"灰雪考",area:"ashfield",text:"原野的雪终年不化。祖母说那不是雪，是黑日尚在时飘落的灰。灰记得旧路，年年落回同一处，等一扇再也不会开的门。"},{id:"c04",title:"母亲的日记",area:"ashfield",text:"孩子夜里哭，说天上有一张嘴。神父罚我加倍祷告。我抱他望天，白昼深处确有什么在缓缓吞咽。从那晚起，我不再出声祈祷。"},{id:"c05",title:"逃兵家书",area:"ashfield",text:"他们让我们为白昼而战。可阵亡者的脸全都朝上，像被什么点过名。妹妹，若我死了，把我埋深些，脸朝土。别让天看见我。"},{id:"c06",title:"碑文拓片",area:"ashfield",text:"此地立碑三千，碑碑朝天张口。石匠临终吐露：教会订碑只有一个要求——碑口的弧度，必须与漏斗一致。他们要的从来不是碑。"},{id:"c07",title:"拾骨人的账",area:"ashfield",text:"骨头越来越轻。二十年前一具骨能压弯扁担，如今一把便可攥住。有什么在把死人往空里掏，连骨髓深处的悔恨都不肯放过。"},{id:"c08",title:"旧历残页",area:"ashfield",text:"黑昼纪元：无昼无夜，黑日悬空。死者归其腹，生者沐其影。无天堂，无地狱，无祷告。史官朱批：删。此页不得留档。"},{id:"c09",title:"牧童谣",area:"ashfield",text:"灰原上的孩子唱：一祷瘦一分，二祷失一魂，三祷莫抬头，天上有人收。大人听见就打。打完了，又自己躲起来哭。"},{id:"c10",title:"巡夜人供词",area:"ashfield",text:"我看见教士们深夜检修一根光柱，从祷告堂直插天心。他们叫它「管道」。我发誓不再说了，求你们别把我的名字放进香炉。"},{id:"c11",title:"灰烬遗嘱·残篇",area:"ashfield",text:"若灯还亮，就照旧路走。灰会替你记得身体的形状。死不是终点，是誊写。每誊写一次，字迹就更接近真话一分。"},{id:"c12",title:"第七钟灾变见闻",area:"ashfield",text:"那一夜第七口钟自己响了。半城的人当场跪倒，再没有站起。天上的白昼亮得像伤口崩开。我娘只说了三个字：它吃撑了。"},{id:"s1",title:"圣徒告解·第一刀",area:"ashfield",text:"我是执刀者。切下黑日之影时，它没有反抗，只像所有母亲那样，把伤口转向自己内侧。我们向白昼欢呼。它在流血。我知道。"},{id:"c13",title:"辅祭日课",area:"cathedral",text:"主教命我们把告解词分类：悔恨入金匣，恐惧入银匣，绝望入铅匣。匣底有细管，直通穹顶。我问通向哪里。他说：通向恩典。"},{id:"c14",title:"香料清单",area:"cathedral",text:"本月耗用：圣名三千二百枚，童声唱段七十节，寡妇守夜泪十一瓶。批注：香愈纯，天愈饱。落款一个字：弥。"},{id:"c15",title:"悔罪者铭",area:"cathedral",text:"我在告解室跪了四十年，罪却一年比一年多。今日方懂：不是我在生罪，是他们需要我有罪。无罪之人，喂不了天。"},{id:"c16",title:"圣像修复记",area:"cathedral",text:"剥开圣母像的金漆，里面是一具真的骨。骨上刻满小字，全是同一句：对不起。修复师当夜还俗，携凿远遁，不知所终。"},{id:"c17",title:"唱诗班名录",area:"cathedral",text:"嗓音最好的孩子会被选去「天窗」。名录上他们的名字旁画着一支蜡烛，没有归期栏。后来，母亲们学会了教孩子唱哑。"},{id:"c18",title:"腐香病理",area:"cathedral",text:"教堂的香会腐。腐香入肺，人便日夜想要忏悔，不忏悔则痛。医士言：此非病，是饵。教会焚我医案，我凭记忆重写于此。"},{id:"c19",title:"门房夜记",area:"cathedral",text:"深夜有货车抵达后门，卸下的木箱形如棺而轻如纸。押车修士说：空棺入库，实棺升天。他笑起来的样子，让我把晚饭吐了。"},{id:"c20",title:"异端审讯录·摘",area:"cathedral",text:"犯人临刑只说一句：你们烧我，因为我算出了白昼的口径。刑官记：胡言。但当夜，穹顶的光，确实收缩了一寸。"},{id:"c21",title:"主教私函",area:"cathedral",text:"致圣座：本教区情绪产量下滑。恳请拨发恐慌，一场瘟疫或一次神迹皆可。人心若安稳，天庭便挨饿。切切。不具名。"},{id:"c22",title:"扫堂老妇",area:"cathedral",text:"我扫了一辈子蜡泪。蜡泪冷了会拼字。今晨它们拼出一个「救」。我假装没看见，把它们扫成看不出意思的形状。原谅我。"},{id:"c23",title:"祷告机原理",area:"cathedral",text:"风琴的管并不发声，是抽气。会众唱得越恸，抽得越急。琴师故意弹错过一次，全场无人流泪。那一天，穹顶暗了一瞬。"},{id:"c24",title:"还俗者的信",area:"cathedral",text:"烧掉圣袍那夜，我梦见黑日。它不审判我，不要我跪，只让我在它影子里坐了一会儿。醒来，我三十年来头一次不想忏悔。"},{id:"s2",title:"圣徒告解·穹顶",area:"cathedral",text:"我设计了第一座祷告堂。穹顶的弧度，是照着那道伤口描的。此后每一声阿门都是往伤里撒的盐。我建的不是圣所，是刑具。"},{id:"c25",title:"沉城水文",area:"bells",text:"城沉没于一夜之间。潜者言：街道完好，餐桌摆着饭，唯独所有人保持仰头的姿势。他们沉下去时，正在看天上的什么。"},{id:"c26",title:"铸钟师绝笔",area:"bells",text:"教会订制的七口钟，图纸倒着看才明白：那不是钟，是塞子。七处灵脉，七个口。钟声不是召唤，是封条被翻动的声音。"},{id:"c27",title:"钟楼守夜人",area:"bells",text:"每口钟里都住着回声。老七说，回声是没走完的灵魂，卡在半空，上不去也下不来。夜里钟自己嗡嗡响，是他们在里面撞壁。"},{id:"c28",title:"渔妇口述",area:"bells",text:"水底捞上来的骨，手指全指着同一个方向。制图师来量过，说指向天顶偏西——白昼开口的位置。后来，他弄瞎了自己的眼睛。"},{id:"c29",title:"第七钟铭文",area:"bells",text:"钟身内壁刻着官文：当七钟齐鸣，管道全开，收割毕，牧场休。铸者在角落泣血补了一行小字：愿此钟永哑。愿我有罪。"},{id:"c30",title:"瓶中信",area:"bells",text:"城要沉了。妈妈让我把想说的话装进瓶子。我想说：我不怕水，我怕天。水只是淹死我，天会把我叫上去。瓶子，请漂远些。"},{id:"c31",title:"吞钟鲸目击录",area:"bells",text:"鲸腹传出钟声，整点不差。学者说它吞钟是为替沉城报时。渔人摇头：不对。它把钟声吃进去，不让天听见。它在护着我们。"},{id:"c32",title:"打捞禁令",area:"bells",text:"总铎令：沉城水域永久禁捞。渔民不解，尸骨无人认领。副铎醉后吐真：不是怕你们捞尸，是怕你们捞出钟底压着的东西。"},{id:"c33",title:"水鬼夜话",area:"bells",text:"溺者不腐，围着沉钟打转，像围着炉火取暖。问其缘故，答曰：钟影之内，天看不见。我们死在这里的人，是漏网的。"},{id:"c34",title:"潮汐表批注",area:"bells",text:"大潮总在大祭日之后。涨上来的不是水，是没被收走的悲伤，从四面八方，流向这座不肯祷告的城。此处水最咸，也最干净。"},{id:"c35",title:"沉城遗民歌",area:"bells",text:"我们不唱赞美诗，我们唱水。水往低处走，不上天。若有来生，做一尾鱼，眼睛长在侧面，一辈子不必看天。"},{id:"s3",title:"圣徒告解·封钟",area:"bells",text:"七钟是我铸的封印，封住黑日残存的呼唤。每逢深夜它低声唤孩子们回家，钟声就替我们盖过去。我封住的，是唯一的退路。"},{id:"c36",title:"入狱登记簿",area:"hell",text:"罪名栏抄录如下：拒绝安息。质疑光。祷告时睁眼。记得黑日。爱一个死人爱得不肯撒手。狱吏批：均属危险思想，永押。"},{id:"c37",title:"铁花园园丁",area:"hell",text:"铁在这里开花，因为地狱的土壤是真相，谎言种不活。你埋下一句真话，一夜就窜出满枝黑刺。天堂怕的不是火，是这园子。"},{id:"c38",title:"产房记录",area:"hell",text:"今日接生三名：一名不肯忘记的老兵，一名咬穿假天堂的修女，一名无名者。皆是二次诞生，皆哭声如钟。都是好孩子。"},{id:"c39",title:"囚徒刻字",area:"hell",text:"墙上万人刻着同一句：我没有疯。第一千次读到时我哭了。第一万次读到时我懂了：关我们在此，就是要让这句话变成疯话。"},{id:"c40",title:"狱卒手册·禁章",area:"hell",text:"囚徒若谈及「白昼为器」，不必制止。无人会信。真相最好的牢房，就是让它听起来像疯话。此乃第一狱训，阅后即焚。"},{id:"c41",title:"断翼羽的来历",area:"hell",text:"铁门之上钉着一根白羽，锈钉贯穿。老囚说，那夜天裂了一道缝，有人抱着满怀的灵魂往下逃。最后，只逃出这一根羽毛。"},{id:"c42",title:"地狱矿脉志",area:"hell",text:"此地矿石皆为压缩的记忆。凿开一块，能听见一段被删去的历史。教会每百年下来回购一次，运走的矿车队，看不见尾。"},{id:"c43",title:"异端名册·地狱卷",area:"hell",text:"在人间他们是疯子、渎神者、纵火犯。在这里换算过来：天文学家，翻译家，还有第一个指着白昼说出「那是嘴」的孩子。"},{id:"c44",title:"守门人对答",area:"hell",text:"问：地狱为何不设刑罚。答：真相即刑。让你们清醒地记得一切，又永远出不去告诉任何人——这之后，还需要火吗。"},{id:"c45",title:"越狱者遗书",area:"hell",text:"我不越向人间，人间是牧场。我要向上越。听着：假天堂的墙是甜的，用牙。真天堂的墙是悔恨砌的，用刀。替我试试。"},{id:"c46",title:"铁花语",area:"hell",text:"园丁教我认花：黑刺花是冤屈，白锈花是未寄出的信，双生花是被拆散的母子。花在这里从不凋谢。地狱的记性太好了。"},{id:"s4",title:"圣徒告解·仓库",area:"hell",text:"地狱是我提议建的。总得有地方放不肯闭眼的人。我以为是权宜，后来成了行业。如今我也在此。狱中最重的刑：我记得一切。"},{id:"c47",title:"入境须知",area:"fakeheaven",text:"欢迎抵达安息之地。入境请交出：姓名，痛觉，昨日。此地以微笑为通用语。回头，属于违禁品。祝您永远、永远幸福。"},{id:"c48",title:"定居笔记·第一年",area:"fakeheaven",text:"这里真好。不饿，不冷，不疼。只是渐渐想不起女儿的脸了。招待说：忘了才轻松。可我，是为了再见她一面才肯死的啊。"},{id:"c49",title:"定居笔记·不知何年",area:"fakeheaven",text:"今天有人问我从哪里来。我张开嘴，发现只会说：我很幸福。这四个字底下曾压着一个名字。现在，连压痕都被抚平了。"},{id:"c50",title:"园丁工作条例",area:"fakeheaven",text:"草地须常绿。烛火须恒温。住民面部弧度低于标准者，登记在册，上报移民官。阴影为一级隐患，发现即刻上报，不得逗留。"},{id:"c51",title:"白羊经",area:"fakeheaven",text:"羊不必知道栏为何物。栏即世界，草即恩典，嚼食即礼拜。若有羊立起、直视、发问——那便不再是羊了。移交清算程序。"},{id:"c52",title:"没写完的信",area:"fakeheaven",text:"这里的糖太多，甜得像堵嘴。我偷藏了一粒石子在舌下，硌着，疼着，好记得我还欠人间一句道歉。他们好像快发现了，我"},{id:"c53",title:"移民官备忘",area:"fakeheaven",text:"编号如上者，顺从满百，即日转入景观序列。备注：立于湖畔为佳，其微笑弧度出众。原有记忆焚毁，灰烬按例上缴天庭。"},{id:"c54",title:"假天堂奠基碑",area:"fakeheaven",text:"圣堂纪元末，诸圣议决：真天堂已不可居，另筑慰所于其外，工程代号「摇篮」。碑侧有后人刻痕：摇篮与牢笼，同一种木头。"},{id:"c55",title:"醒来者涂鸦",area:"fakeheaven",text:"写在凉亭背面：站进影子里，头脑会清醒。见到不眨眼的就动手，别道歉。钟响时数到二十一。记住，有个穿白衣的在数你。"},{id:"s5",title:"圣徒告解·金边",area:"fakeheaven",text:"假天堂由我执笔规划。我给每个谎言都描了金边。临终只求一事：把我葬在这片草地之下，让被我骗来的人，踩着我微笑。"},{id:"c56",title:"天堂解剖学·序",area:"trueheaven",text:"真天堂并非殿宇。它有蠕动的廊，有酸的河，有整面墙的腺体。诸位修士，我们建造的一切圣所，不过是这具躯体的义齿。"},{id:"c57",title:"管道工残页",area:"trueheaven",text:"顺着祷告管一路向上，尽头不是宝座，是瓣膜。亿万句阿门在此拥塞、发酵。我终于听懂：天堂不听祈祷。天堂消化祈祷。"},{id:"c58",title:"圣母观察记录",area:"trueheaven",text:"她仍以为自己在哺育。每一道涌入的悔恨，她都当作乳汁咽下。腐化的从来不是她的心，是喂给她的东西。谁忍心告诉她。"},{id:"c59",title:"白廊尽头的门",area:"trueheaven",text:"门上无锁，只写一行字：入此门者，交还幻觉。大多数灵魂在此转身，回假天堂去了。门内传出的不是恐怖。是安静。"},{id:"c60",title:"第一祷告的化石",area:"trueheaven",text:"腺壁深处嵌着最古老的一句祷词，早已钙化：黑日啊，谢谢你收留我们的死。——原来最初的祈祷是道谢，而不是索取。"},{id:"c61",title:"清算程序日志",area:"trueheaven",text:"菲纳里斯，第无数次运行。异常：某灵魂逾时未清，反向移动，携灯。批注（手写体，非程序体）：有意思。放行一次试试。"},{id:"c62",title:"天堂裂缝考",area:"trueheaven",text:"承重壁裂缝逐年扩张，填缝物为压实的赞美诗。首席工程师结论：无法根治。病因一行：罪的进项，远大于恩典的出项。"},{id:"c63",title:"最后的修士",area:"trueheaven",text:"我看见了全部真相，却选择留下来擦拭她的脚。她坏了，但她曾收留过所有人的死。哪怕是腐坏的母亲，也曾经是母亲。"},{id:"s6",title:"圣徒告解·喂养",area:"trueheaven",text:"我负责喂养。第一勺悔恨灌进她口中时，她还能唤我的名字。第一千年，她只剩吞咽。诸位：神不死于亵渎，神死于供奉。"},{id:"s7",title:"圣徒告解·第七印",area:"trueheaven",text:"我是七人中最后死的，看完了全部结局。若有来者读到此页：我们错在以为黑暗需要拯救。去吧，把夜还给人间。替我熄灯。"}],bosses:{anlo:{name:"裂腹圣徒·安洛",intro:["他剖开自己的腹，供人瞻仰空无。","「看啊。信仰把我掏得多干净。」"],death:["「谢谢……终于有东西填进来了。」","腹中滚落一枚干瘪的黑籽。"]},mimi:{name:"腐香主教·米弥",intro:["「闻到了吗。这是圣洁的味道。」","香炉倾倒，涌出亿万个名字。"],death:["「别灭香……名字们会冷的……」","灰烬里，无数名字终于睡去。"]},whale:{name:"吞钟鲸",intro:["水面隆起。全城的钟声在它腹内。","它张口，七个世纪一并回响。"],death:["鲸缓缓沉底。钟声第一次自由了。","水下传来一声迟到的晚祷。"]},finalis:{name:"终末书记官·菲纳里斯",intro:["「逾时者。程序即正义。」","「你的名字已誊入注销栏。」"],death:["「记录……出现了……空行……」","墨水逆流，回到他的眼中。"]},rahshiel:{name:"堕翼审判者·拉赫希尔",intro:["「来。让我称一称你的异议。」","断翼撑开，锁链绷成竖琴。"],death:["「好……好一个异端。」","他笑了。灰从眼角落下来。"]},margola:{name:"地狱产婆·玛戈拉",intro:["「又一个不肯睡的孩子。」","「来。产床已经烧红了。」"],death:["「铁里的花……替我接生……」","满园黑刺，一夜之间开白。"]},lambking:{name:"白羊之王",intro:["万羊垂首。王冠是一圈祈祷。","「跪下。幸福是义务。」"],death:["羊毛散开，里面什么也没有。","假天堂第一次有了阴影。"]},mother:{name:"原初圣母·黑昼",intro:["她坐在天堂中央，宏伟而佝偻。","亿万祈祷穿过她，如针穿旧布。","「孩子。你也是来喂我的吗。」"],death:["她垂下头，像一座熄灭的城。","「谢谢……我听见安静了……」","黑日在她胸腔里，缓缓睁眼。"]}},finalChoice:{prompt:["祈祷输送器仍在头顶轰鸣。","选择吧。以你死过三次的名义。"],destroy:{label:"摧毁祈祷输送器",desc:"切断收割。让黑暗与星辰归还人间。"},inherit:{label:"戴上黑环",desc:"接过清算之职，成为新的终末书记官。"},purify:{label:"净化圣母",desc:"焚尽腐化，也焚尽她仅存的记忆。"},enter:{label:"走入黑日",desc:"背对一切，向未曾诞生的世界启程。"}},endings:{whitedream:{title:"白昼长梦",lines:["你放下武器时，光更温柔了。","招待者替你合眼，像合上信封。","从此你立在草地尽头，微笑。","偶有游客驻足：这尊像真安详。","没有人记得你曾试图醒来。","白昼很长。梦，正好一样长。"]},hellking:{title:"地狱新王",lines:["铁花园为你让开一条锈的路。","真相仓库需要一个不怕它的王。","你落座。铁钉自行收拢为冠。","自此，地狱不再收押清醒的人。","只收押撒谎的神。"]},blackcrown:{title:"黑环继位",lines:["墨水认下了它新的主人。","黑环收紧，心跳变成钟摆。","你照旧清场，却改写了条款。","死亡准时，但不再替天堂收割。","每晚廿一时，你敲钟，放人回家。"]},dawn:{title:"人间黎明",lines:["输送器断裂的声音，像退潮。","白昼熄灭。人间第一次真正黑下来。","恐慌只持续了一夜。","然后有人抬头，喊出陌生的词。","星星。真正的星星，第一次出现。","死者沿黑日的辉光，缓缓归家。","心灯在你胸中安静下来。","黎明将至。这次，它不欠任何人。"]},eighthday:{title:"第八日",lines:["你走入黑日，如走入自己的瞳孔。","身后，世界合拢成读完的书。","腹内没有死亡，只有未点名的光。","第七日他们休息。第八日，你启程。","别处的天空，等着谎言之前的你。"]}},tips:["闪避的刹那有0.22秒无敌。像死过一小次。","武器与对应催化物皆满级，可融合为神器。","跳过升级可恢复15%生命。凡庸自有报偿。","在假天堂里，站进阴影，顺从会缓慢降低。","攻击伪装的住民也能压低顺从。他们不是人。","流血遇上灼烧，血会沸腾，然后爆裂。","腐烂叠上罪印，将触发亵渎绽放。","恐惧使敌人迟缓。神也会怕。","死神于21:00准时到来。钟从不迟到。","每一局，只有一次挑战堕翼审判的资格。","创世禁器，需要两件神器与一枚世界核心。","心灯保存死前几分钟的记忆。别浪费遗言。","你每死一次，灵车就离天堂更近一里。","顺从达到一百，你将成为风景的一部分。","祷告之前，先问一问祷词流向哪里。"]}});var Mi,_t,Ot=L(()=>{Mi={shroudman:{name:"裹尸人",sprite:"shroud",hp:12,dmg:6,speed:46,r:13,behavior:"chase"},gravehound:{name:"墓犬",sprite:"hound",hp:8,dmg:5,speed:74,r:12,behavior:"dart"},bonecrow:{name:"骨鸦",sprite:"crow",hp:5,dmg:3,speed:56,r:10,behavior:"swarm"},diggermonk:{name:"挖墓修士",sprite:"monk",hp:22,dmg:8,speed:38,r:14,behavior:"chase"},waxbride:{name:"蜡尸新娘",sprite:"bride",hp:30,dmg:9,speed:30,r:14,behavior:"shoot",proj:{dmg:7,speed:150,cd:3.2}},ashghoul:{name:"灰烬食尸鬼",sprite:"ashghoul",hp:15,dmg:7,speed:52,r:13,behavior:"chase"},ashmonk:{name:"香灰修士",sprite:"monk",tint:"#75876B",hp:26,dmg:11,speed:44,r:14,behavior:"chase",status:"rot"},waxchoir:{name:"蜡面唱诗班",sprite:"choir",hp:20,dmg:9,speed:40,r:13,behavior:"shoot",proj:{dmg:10,speed:130,cd:2.8}},blindnun:{name:"盲眼修女",sprite:"nun",hp:34,dmg:13,speed:52,r:13,behavior:"orbit"},praycentipede:{name:"祷告蜈蚣",sprite:"centipede",hp:44,dmg:12,speed:66,r:16,behavior:"dart"},bellpenitent:{name:"背钟苦修者",sprite:"bellback",hp:60,dmg:16,speed:26,r:16,behavior:"chase",armor:20},chapelwalker:{name:"行走圣龛",sprite:"chapel",hp:40,dmg:10,speed:30,r:15,behavior:"summoner",summon:"bonecrow",cd:6},drownedsoldier:{name:"溺亡兵",sprite:"drowned",hp:45,dmg:15,speed:48,r:14,behavior:"chase"},facelesssailor:{name:"无面水手",sprite:"sailor",hp:38,dmg:13,speed:58,r:13,behavior:"orbit"},bell
